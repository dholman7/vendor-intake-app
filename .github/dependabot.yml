# Weekly, grouped, so updates arrive as one reviewable PR per ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups: { backend: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { frontend: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups: { e2e: { patterns: ["*"] } }
