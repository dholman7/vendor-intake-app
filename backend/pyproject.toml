[project]
name = "vendor-intake-api"
version = "0.1.0"
description = "FastAPI backend for the vendor intake demo app"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# VI_EXTRACTION_BACKEND=claude. pypdf reads PDF text to ground the model's quotes; 7.x shipped
# 2026-11-06, adopt after two weeks.
llm = ["anthropic>=1.15,<2", "pypdf>=6.21,<7"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    # Starlette's TestClient uses httpx2 when installed and deprecates httpx; anthropic 1.x
    # installs httpx2 anyway, so depend on it directly.
    "httpx2>=2.15,<3",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
# The extraction evals (evals/extraction). fpdf2 renders the golden set's PDFs (2.9.0 shipped
# 2026-10-29); agent-eval-gate supplies the paired gate, pinned to a commit.
evals = [
    "fpdf2>=2.8.9,<2.9",
    # Two newer stub releases shipped this month; adopt after two weeks.
    "types-PyYAML>=6.0.12.20260906,<6.0.12.20261103",
    "agent-eval-gate @ git+https://github.com/dholman7/agent-eval-gate@405ee5415d3d9a7b99a6e43ecd498ef2b0adf8ac",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendor_intake"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/**/test_*.py" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# agent-eval-gate ships no py.typed marker; the evals call two of its functions.
module = ["agent_eval_gate.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
